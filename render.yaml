services:
  - type: web
    name: certflow-ai
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: CERTFLOW_AI_PROVIDER
        value: local
      - key: CERTFLOW_OTEL_STDOUT
        value: "true"
      - key: OTEL_SERVICE_NAME
        value: certflow-ai
      - key: CERTFLOW_DB
        fromDatabase:
          name: certflow-ai-db
          property: connectionString

databases:
  - name: certflow-ai-db
    plan: free
